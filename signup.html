<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AutoVerify used car marketplace and inspection management platform.">
    <title>Create Account | AutoVerify</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        :root {
            --primary-blue: #1d3557;
            --navbar-bg: #ffffff;
            --header-text: #374151;
            --body-text: #475569;
            --charcoal-text: #1f2937;
            --light-bg: #f0f4f8;
            --border-color: #e2e8f0;
            --green-accent: #1f7a4c;
        }

        body {
            background-color: var(--light-bg);
            color: var(--body-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .navbar-brand {
            color: var(--header-text);
            font-weight: 700;
        }

        h1, h2, h3, h4, h5, .section-title {
            color: var(--charcoal-text);
        }

        .text-primary {
            color: var(--primary-blue) !important;
        }

        .btn-primary {
            background-color: var(--primary-blue);
            border-color: var(--primary-blue);
            color: #ffffff;
        }
        .btn-primary:hover {
            background-color: #14243b;
            border-color: #14243b;
            color: #ffffff;
        }

        .auth-card {
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .form-label {
            color: var(--charcoal-text);
            font-weight: 500;
        }

        .page-footer {
            color: var(--body-text);
            background-color: #ffffff;
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg bg-white border-bottom">
        <div class="container py-2">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <span class="brand-name fs-5">AutoVerify</span>
            </a>
            <div class="ms-auto">
                <a href="index.html" class="btn btn-sm btn-outline-secondary" style="color: var(--primary-blue); border-color: var(--border-color);">Back to Home</a>
            </div>
        </div>
    </nav>

    <main class="container d-flex flex-column align-items-center justify-content-center py-5 my-auto">
        <div class="col-md-6 col-lg-5">
            <div class="auth-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="text-primary fw-bold small text-uppercase mb-1">Get started</div>
                    <h1 class="h3 fw-bold mb-2">Create an account</h1>
                    <p class="muted small mb-0">Join AutoVerify to buy, sell, or inspect vehicles.</p>
                </div>

                <form>
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" placeholder="Ahmed Raza" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control" placeholder="name@example.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" placeholder="Create a password" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">I want to register as</label>
                        <select class="form-select">
                            <option value="buyer">Buyer</option>
                            <option value="seller">Seller</option>
                            <option value="inspector">Vehicle Inspector</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 mb-3">Create account</button>
                </form>

                <div class="text-center small">
                    <span class="muted">Already have an account?</span> 
                    <a href="login.html" class="text-primary text-decoration-none fw-bold">Sign in</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="container-fluid page-footer px-4 py-3 text-center">
        <small>© 2026 AutoVerify · Static university project demonstration</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
